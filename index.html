<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>李楠的个人主页</title>
<link rel="shortcut icon" href="assets/favicon.ico">
<style>
:root{
  --body-color:#ecf0f3; --main-color:#fff; --shadow-color:#e6e6eb;
  --text-color:#424242; --other-color:#eee; --icon-color:invert(0%);
  --accent:#2ecc71;
}
[theme='dark']{
  --body-color:#343434; --main-color:#484848; --shadow-color:#303030;
  --text-color:#ccc; --other-color:#aaa; --icon-color:invert(90%);
  --accent:#2ecc71;
}
*{margin:0;padding:0;border-radius:8px;box-sizing:border-box;font-family:'GenSenRounded','PingFang SC','Microsoft YaHei',sans-serif;transition:background-color .8s ease,box-shadow .8s ease,border .8s ease;line-height:1.3}
a{color:var(--text-color);text-decoration:none;-webkit-tap-highlight-color:rgba(255,255,255,0);transition:all .3s ease}
li{list-style:none}
button{font-family:inherit;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;border:none;outline:none;background:transparent;color:var(--text-color)}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;background-color:var(--body-color);padding:20px 0}
@font-face{font-family:'GenSenRounded';src:url('assets/GenSenRounded-R.woff2')}

/* ===== 前台 ===== */
#stage{display:flex;flex-direction:column;align-items:center}
nav{width:350px;height:50px;max-width:85%;background-color:var(--main-color);margin-bottom:15px;box-shadow:1px 1px 1px 1px var(--shadow-color);display:flex;justify-content:space-evenly;align-items:center}
nav a{font-size:large;padding:2px 6px}
nav img{width:22px;filter:var(--icon-color);cursor:pointer}
.active{transform:scale(1.1);color:var(--accent)}
main{width:350px;height:440px;max-width:85%;margin-bottom:50px;position:relative;background-color:var(--main-color);box-shadow:1px 1px 1px 1px var(--shadow-color);scroll-snap-type:x mandatory;display:flex;overflow:auto}
main::-webkit-scrollbar,#site::-webkit-scrollbar{display:none}
section{width:100%;padding:15px;display:flex;flex-shrink:0;flex-direction:column;align-items:center;scroll-snap-align:center;scroll-snap-stop:always;overflow:auto}
.home-head{width:100%;position:relative;flex-shrink:0;background-color:var(--body-color);border-radius:8px}
#bg{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}
.avatar{width:84px;height:84px;border-radius:50%;position:absolute;top:calc(100% - 42px);left:50%;transform:translateX(-50%);object-fit:cover;cursor:pointer;border:3px solid var(--main-color);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.info{width:100%;flex-grow:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--text-color);padding:50px 0 10px}
.info h2{font-size:22px;margin-bottom:4px}
.info h4{font-size:13px;font-weight:400;color:#aaa}
#link{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 4px 0}
#link a{display:flex;align-items:center}
#link img{width:30px;height:30px;object-fit:contain;filter:var(--icon-color)}
.item{width:100%;height:100%;padding:10px;box-shadow:inset 0 0 2px 3px var(--shadow-color);color:var(--text-color);overflow:auto}
.item h3{font-size:15px;margin-bottom:8px;color:var(--text-color)}
.item .rich{font-size:14px}
#project{height:auto;display:flex;justify-content:space-between;align-items:center;margin-top:15px}
#line{height:100%;padding-left:10px;scroll-snap-type:y mandatory;overflow-y:scroll;width:100%}
#line::-webkit-scrollbar{width:5px}
#line::-webkit-scrollbar-track{border-radius:8px;background-color:var(--body-color)}
#line::-webkit-scrollbar-thumb{border-radius:8px;background-color:#ccc}
#line li{position:relative;padding:15px 0 0 15px;border-left:3px solid var(--other-color);border-radius:0;scroll-snap-align:end;color:#aaa;font-size:14px}
#line li:first-child{color:var(--accent);font-weight:bolder}
.focus{width:15px;height:15px;border-radius:22px;background-color:var(--other-color);border:3px solid var(--main-color);position:absolute;left:-9px;top:50%;transform:translateY(-50%)}
#line li:first-child .focus{background-color:var(--accent);animation:focus 1.8s ease infinite}
@keyframes focus{0%{box-shadow:0 0 0 0}50%{box-shadow:0 0 0 3px #9ef9a1}100%{box-shadow:0 0 0 0}}
#site{width:100%;overflow:auto}
#site li{height:60px;padding:10px;cursor:pointer;line-height:40px;margin-bottom:15px;position:relative;background-image:repeating-linear-gradient(-45deg,var(--body-color),1.125rem,transparent 1.125rem,transparent 2.25rem);transition:all .2s ease-in;overflow:hidden}
#site li:last-child{margin-bottom:0}
#site li:hover{line-height:20px}
#site li.site-more{height:44px;line-height:44px;background:var(--other-color);text-align:center;font-size:14px;color:var(--text-color);background-image:none;cursor:pointer}
#site li.site-more:hover{line-height:44px}
#site li.site-more:active{opacity:.7}
#site li a{display:block;height:100%;width:100%}
.status{position:absolute;right:10px;top:5px;font-size:12px}
footer{width:100%;height:40px;line-height:40px;text-align:center;background-color:var(--main-color);box-shadow:-1px -1px 1px var(--shadow-color);font-size:13px;position:fixed;bottom:0;left:0;z-index:5}
footer a{color:#aaa;margin-left:10px;font-size:12px}
#china{width:70px;position:fixed;right:10px;bottom:40px;z-index:5;pointer-events:none;opacity:.9}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;max-width:86%;text-align:center}
#toast.show{opacity:1}

/* ===== 后台 ===== */
#admin{display:none;width:350px;max-width:92%;flex-direction:column;gap:10px;margin-bottom:60px}
body.admin-open #stage{display:none}
body.admin-open #admin{display:flex}
body.admin-open footer{position:static}
.admin-card{background:var(--main-color);box-shadow:1px 1px 1px 1px var(--shadow-color);padding:14px;color:var(--text-color)}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.admin-head h2{font-size:17px}
.admin-head .btns{display:flex;gap:8px}
.btn{padding:5px 14px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:var(--other-color);color:var(--text-color)}
.btn.danger{background:tomato}
.btn.sm{font-size:12px;padding:3px 10px}
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.admin-tabs a{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--other-color);color:var(--text-color)}
.admin-tabs a.on{background:var(--accent);color:#fff}
.form-item{margin-bottom:10px}
.form-item label{display:block;font-size:12px;color:#aaa;margin-bottom:4px}
.form-item input,.form-item textarea,.form-item select{width:100%;border:1px solid var(--shadow-color);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--main-color)}
.form-item textarea{min-height:70px;resize:vertical;line-height:1.6}
.form-item .rich-input{min-height:140px;font-family:monospace}
.login-box{text-align:center;padding:26px 18px}
.login-box h2{margin-bottom:18px;font-size:18px}
.login-box .form-item input{padding:10px}
.login-tip{font-size:12px;color:#aaa;margin-top:10px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid var(--shadow-color);font-size:13px;gap:8px}
.list-row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list-row .info b{font-size:13px}
.list-row .info span{color:#aaa;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .ops{display:flex;gap:6px;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--other-color);border-radius:8px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat span{font-size:12px;color:#aaa}
.empty{text-align:center;color:#aaa;font-size:13px;padding:16px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.modal-card{background:var(--main-color);border-radius:12px;padding:16px;width:100%;max-width:340px;max-height:86vh;overflow:auto;color:var(--text-color)}
.modal-card h3{font-size:15px;margin-bottom:12px}
.modal-card .form-item input,.modal-card .form-item textarea{border-color:var(--shadow-color)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
/* 倒计时版块：与菜单栏/信息栏同款框 */
#countBox{width:100%;background-color:var(--main-color);box-shadow:1px 1px 1px 1px var(--shadow-color);padding:10px;margin-top:6px;text-align:center;color:var(--text-color);flex-shrink:0}
.count-date{font-size:13px;font-weight:600;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#countBox ul{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#countBox li{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;border-radius:6px;background:var(--body-color);min-width:0}
#countBox li .cd-name{color:#aaa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#countBox li .cd-days{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:420px){
  nav,main{max-width:92%}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

ont-size: 1.1rem;\">李楠 <small style=\"font-weight: 400; color: #94a3b8; font-size: 0.85rem;\">· 2026<\/small><\/span>\r\n  <\/div>\r\n<\/div>","copyright":"本站已安全运行了<b><strong><script language = \"JavaScript\"type = \"text/javascript\" >var urodz = new Date(\"8/22/2026\");var now = new Date();var ile = now.getTime() - urodz.getTime();var dni = Math.floor(ile / (1000 * 60 * 60 * 24));document.write( + dni)<\/script><\/strong><\/b>天","music":"assets/music.mp3","bj":"assets/bg.jpg","title1":"李楠","title2":"欢迎来到我的小屋","user":"admin","pwd":"83955506"},"iconList":[{"url":"","svg":"assets/icons/1.png","id":16},{"url":"","svg":"assets/icons/2.png","id":17},{"url":"","svg":"assets/icons/3.png","id":18},{"url":"","svg":"assets/icons/4.png","id":19},{"url":"","svg":"https://www.zibll.top/wp-content/uploads/2023/01/vip2-1.gif","id":20},{"url":"","svg":"assets/icons/6.png","id":21},{"url":"","svg":"assets/icons/7.png","id":22},{"url":"","svg":"assets/icons/8.png","id":23},{"url":"","svg":"assets/icons/9.png","id":24},{"url":"","svg":"assets/icons/10.png","id":25},{"url":"","svg":"https://www.zibll.top/wp-content/uploads/2023/01/vip1.gif","id":26}],"lineList":[{"time":"2015-01-06","name":"搭建第一个网站","id":1},{"time":"2026-08-22","name":"个人主页上线","id":7},{"time":"2026-08-22","name":"新年倒计时上线","id":8},{"time":"2026-08-24","name":"情侣纪念日上线","id":9},{"time":"2026-08-24","name":"纪念日-喜庆版上线","id":10},{"time":"2026-08-24","name":"过年氛围感单页上线","id":11}],"siteList":[{"name":"新年倒计时","url":"http://linan.698.dpdns.org/djs","content":"新年倒计时","status":true,"id":1},{"name":"恋爱纪念日","url":"http://linan.698.dpdns.org/ql","content":"关于我的恋爱纪念日","status":true,"id":2},{"name":"纪念日-喜庆版","url":"http://linan.698.dpdns.org/xiqingdjs","content":"","status":true,"id":3},{"name":"过年氛围感单页","url":"http://linan.698.dpdns.org/xiqing/","content":"","status":true,"id":4},{"name":"宝宝排便次数记录","url":"http://linan.698.dpdns.org/paibian","content":"","status":true,"id":5}]};
let state=JSON.parse(JSON.stringify(SEED));

async function apiFetch(path,opt={}){
  const headers={'Content-Type':'application/json'};
  if(opt.method&&opt.method!=='GET')headers['x-api-key']=API_KEY;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch(api(path),{...opt,headers,signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json().catch(()=>({ok:false}));
    if(j&&j.ok===false)throw new Error('API error');
    return j;
  }finally{clearTimeout(timer)}
}
async function loadRemote(){

    const j=await apiFetch('/state');
    if(j&&typeof j.data==='object'&&j.data!==null){state=Object.assign({},SEED,j.data);localStorage.removeItem(LS_BACKUP)}

  try{
    const b=localStorage.getItem(LS_BACKUP);

function save(){
  if(offline){saveLocal();render();return}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await apiFetch('/state',{method:'PUT',body:JSON.stringify(state)});localStorage.removeItem(LS_BACKUP)}
    catch(e){toast('云端保存失败，已暂存到本机');saveLocal()}
  },300);
}
function toast(msg){
  const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2600);
}
const $=s=>document.querySelector(s);

/* ===== 前台渲染 ===== */
function render(){
  const c=state.config||{};
  document.title=(c.name||c.title||'个人主页');
  const fav=$('link[rel="shortcut icon"]');if(fav&&c.ico)fav.href=c.ico;
  const bg=$('#bg');if(c.bj)bg.src=c.bj;
  const av=$('#avatar');if(c.logo)av.src=c.logo;
  $('#t1').textContent=c.title1||'';
  $('#t2').textContent=c.title2||'';
  $('#infor').innerHTML=c.infor||'';
  $('#inforxf').innerHTML=c.inforxf||'';
  $('#copyright').innerHTML=renderCopyright(c.copyright||'');
  $('#link').innerHTML=(state.iconList||[]).map(x=>x&&x.svg?`<a href="${escAttr(x.url)}" target="_blank" rel="noopener"><img src="${escAttr(x.svg)}" alt="icon" loading="lazy"></a>`:'').join('');
  $('#line').innerHTML=(state.lineList||[]).slice().sort((a,b)=>(b.id||0)-(a.id||0)).map(x=>`<li><div class="focus"></div><div>${esc(x.time)}</div><div>${esc(x.name)}</div></li>`).join('');
  const sites=(state.siteList||[]);
  const showAll=sites.length<=5||siteMoreOpen;
  let siteHtml=(showAll?sites:sites.slice(0,5)).map(x=>x&&x.name?`<li><a href="${escAttr(x.url)}" target="_blank" rel="noopener"><span class="status">${x.status?'<span style="color:#2ecc71">200</span>':'<span style="color:tomato">404</span>'}</span><span style="font-size:18px">${esc(x.name)}</span><br><span style="color:#aaa;font-size:12px">${esc(x.content)}</span></a></li>`:'').join('');
  if(sites.length>5)siteHtml+=`<li class="site-more" id="siteMore">${showAll?'收起 ▲':'＋ 更多（'+(sites.length-5)+'）▼'}</li>`;
  $('#site').innerHTML=siteHtml;
  if(c.music)$('#audio').src=c.music;
  applyBodyBg(c.bodyBg);
  buildCountBox();
}
function applyBodyBg(v){
  const b=String(v||'').trim();
  const body=document.body;
  if(!b){body.style.background='';return}
  if(/^(#|rgb|hsl|rgba|hsla)/i.test(b))body.style.background=b;
  else body.style.background='url("'+escAttr(b)+'") center / cover no-repeat fixed';
}
function parseDate(s){
  const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);
}
function buildCountBox(){
  const box=$('#countBox');
  if(!box)return;
  const now=new Date();
  const y=now.getFullYear();
  const counts=(state.countList&&state.countList.length)?state.countList:[{name:'元旦',date:(y+1)+'-01-01'},{name:'春节',date:(y+1)+'-02-17'}];
  const valid=counts.filter(x=>x&&x.name&&x.date);
  if(!valid.length){box.style.display='none';box.innerHTML='';return}
  const week=['日','一','二','三','四','五','六'][now.getDay()];
  let html='<div class="count-date">今天是 '+y+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日（星期'+week+'）</div><ul>';
  const today=new Date(y,now.getMonth(),now.getDate()).getTime();
  valid.forEach(x=>{
    const d=parseDate(x.date);
    if(isNaN(d.getTime()))return;
    const target=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const days=Math.round((target-today)/86400000);
    let daysTxt;
    if(days===0)daysTxt='就是今天 🎉';
    else if(days>0)daysTxt='还有 '+days+' 天';
    else daysTxt='已过 '+(-days)+' 天';
    html+='<li><div class="cd-name">距离 '+esc(x.name)+'</div><div class="cd-days">'+daysTxt+'</div></li>';
  });
  html+='</ul>';
  box.innerHTML=html;
  box.style.display='';
}
function renderCopyright(html){
  let days='';
  const m=html.match(/new Date\(["']([\d/]+)["']\)/);
  if(m){
    const start=new Date(m[1]),now=new Date();
    const d=Math.floor((now-start)/86400000);
    if(!isNaN(start)&&d>=0)days=String(d);
  }
  return html.replace(/<script[\s\S]*?<\/script>/gi,days||'');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ===== 前台交互（导航/暗色/音乐）===== */
const dom=document.documentElement;
const mainBox=$('#mainBox');
const musicEl=$('#audio');
let mode=JSON.parse(localStorage.getItem('darkMode'))||false;
if(mode){$('#darkMode').src='assets/moon.svg';dom.setAttribute('theme','dark')}
$('#darkMode').addEventListener('click',()=>{
  mode=!mode;
  $('#darkMode').src=mode?'assets/moon.svg':'assets/sun.svg';
  mode?dom.setAttribute('theme','dark'):dom.removeAttribute('theme');
  localStorage.setItem('darkMode',mode);
});
let isPlay=false;
let siteMoreOpen=false;
let autoplayTried=false;
function tryAutoPlay(){
  if(autoplayTried)return;
  autoplayTried=true;
  if(!musicEl.src)return;
  musicEl.play().then(()=>{$('#musicBtn').src='assets/pause.svg';isPlay=true})
    .catch(()=>{
      // 浏览器默认禁止带声音自动播放，等用户首次交互再播
      const once=()=>{
        document.removeEventListener('pointerdown',once);
        document.removeEventListener('touchstart',once);
        document.removeEventListener('keydown',once);
        if(isPlay||!musicEl.src)return;
        musicEl.play().then(()=>{$('#musicBtn').src='assets/pause.svg';isPlay=true})
          .catch(()=>toast('音乐无法播放，可到后台更换音乐链接'));
      };
      document.addEventListener('pointerdown',once);
      document.addEventListener('touchstart',once);
      document.addEventListener('keydown',once);
    });
}
$('#site').addEventListener('click',e=>{
  if(e.target.closest('#siteMore')){
    siteMoreOpen=!siteMoreOpen;
    render();
  }
});
$('#musicBtn').addEventListener('click',()=>{
  if(isPlay){musicEl.pause();$('#musicBtn').src='assets/play.svg'}
  else{musicEl.play().then(()=>{$('#musicBtn').src='assets/pause.svg'}).catch(()=>toast('音乐无法播放，可到后台更换音乐链接'))}
  isPlay=!isPlay;
});
musicEl.addEventListener('pause',()=>{if(!musicEl.ended){$('#musicBtn').src='assets/play.svg';isPlay=false}});
document.querySelector('nav').addEventListener('click',e=>{
  const a=e.target.closest('a');
  if(a&&a.id){
    e.preventDefault();
    const sec=document.querySelector(`section[title="${a.id}"]`);
    if(sec)mainBox.scrollTo({left:sec.offsetLeft,behavior:'smooth'});
  }
});
let navTimer=null;
mainBox.addEventListener('scroll',e=>{
  if(navTimer)clearTimeout(navTimer);
  navTimer=setTimeout(()=>{
    document.querySelectorAll('section').forEach(sec=>{
      if(Math.abs(e.target.scrollLeft-sec.offsetLeft)<50){
        document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
        const nav=document.querySelector(`nav a[id="${sec.getAttribute('title')}"]`);
        if(nav)nav.classList.add('active');
      }
    });
  },200);
});

/* ===== 路由 ===== */
let adminLogged=sessionStorage.getItem('ln_admin')==='1';
function route(){
  const h=location.hash;
  if(h.startsWith('#/admin')){
    document.body.classList.add('admin-open');
    if(!adminLogged){$('#loginView').style.display='';$('#adminView').style.display='none';return}
    $('#loginView').style.display='none';$('#adminView').style.display='';
    const mod=(h.split('/')[2]||'overview');
    document.querySelectorAll('#adminTabs a').forEach(a=>a.classList.toggle('on',a.dataset.mod===mod));
    renderAdmin(mod);
  }else{
    document.body.classList.remove('admin-open');
    const id=(h||'').replace('#','')||'home';
    const sec=document.querySelector(`section[title="${id}"]`);
    if(sec)setTimeout(()=>mainBox.scrollTo({left:sec.offsetLeft,behavior:'auto'}),0);
  }
}
window.addEventListener('hashchange',route);
$('#backHome').addEventListener('click',()=>location.hash='#home');
$('#logoutBtn').addEventListener('click',()=>{adminLogged=false;sessionStorage.removeItem('ln_admin');location.hash='#/admin'});
$('#loginBtn').addEventListener('click',doLogin);
$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function doLogin(){
  const u=$('#loginUser').value.trim(),p=$('#loginPass').value;
  const c=state.config||{};
  if(u===c.user&&p===c.pwd){
    adminLogged=true;sessionStorage.setItem('ln_admin','1');
    toast('登录成功');route();
  }else toast('账号或密码错误');
}

<script>
/* ===== 后台管理 ===== */
let modalCb=null;
function modal(title,body,onSave){
  const m=document.createElement('div');m.className='modal show';m.id='modalBox';
  m.innerHTML=`<div class="modal-card"><h3>${esc(title)}</h3>${body}<div class="modal-btns"><button class="btn ghost" data-act="cancel">取消</button><button class="btn" data-act="ok">保存</button></div></div>`;
  modalCb=onSave;
  m.addEventListener('click',e=>{
    if(e.target===m||e.target.dataset.act==='cancel'){m.remove();modalCb=null;return}
    if(e.target.dataset.act==='ok'){if(modalCb)modalCb();m.remove();modalCb=null}
  });
  document.body.appendChild(m);
}
function field(name,label,val,multi){
  return `<div class="form-item"><label>${label}</label><${multi?'textarea':'input'} name="${name}" ${multi?'class="rich-input"':''}>${multi?esc(val):''}</${multi?'textarea':'input'}></div>`;
}
function fval(name){const el=document.querySelector(`.modal [name="${name}"]`);return el?el.value:''}
